
<h1>Log in to Our Calendar</h1>

<form method="post">
    {% csrf_token %}

    <div>
        <label for="username">Username:</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >
    </div>

    <div>
        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >
    </div>

    <button type="submit">Sign in</button>
</form>
